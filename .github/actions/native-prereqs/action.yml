name: Native prerequisites
description: >
  Sous-modules, toolchain NDK/glslc, shaders Vulkan (avec cache), libOpenCL.so,
  Java et Gradle. Partagé par native.yml et release.yml : le checkout reste à
  la charge du workflow appelant.

inputs:
  gradle-cache:
    description: >
      Cache Gradle de setup-gradle. Depuis la v6 il passe par un composant
      propriétaire (gradle-actions-caching) : release.yml le coupe, le job qui
      tient le keystore n'exécute que du code ouvert.
    default: 'true'

runs:
  using: composite
  steps:
  # Comme ci.yml : llama.kt seul, en shallow. Ses sous-modules sont initialisés
  # au cas par cas plus bas.
  - name: Fetch llama.kt submodule
    shell: bash
    run: git submodule update --init --depth 1 third_party/llama.kt

  # OpenCL-Headers est un include du CMakeLists (`${SRC_DIR}/../../../../
  # third_party/OpenCL-Headers`), OpenCL-ICD-Loader produit le libOpenCL.so
  # contre lequel llamakt se lie. 2 Mo à deux, ils sont toujours nécessaires.
  # llama.cpp (155 Mo) n'est PAS initialisé ici : il ne sert qu'à générer les
  # shaders, donc uniquement quand le cache manque (voir plus bas).
  - name: Init OpenCL submodules
    working-directory: third_party/llama.kt
    shell: bash
    run: |
      git submodule update --init --depth 1 \
        third_party/OpenCL-Headers third_party/OpenCL-ICD-Loader

  # La version du NDK est lue dans le build.gradle.kts de llama.kt plutôt
  # que recopiée ici : une seule source de vérité, pas de dérive silencieuse.
  # glslc vient du NDK, pas d'un paquet système : il est ainsi épinglé par la
  # même version, et sa sortie SPIR-V ne dépend plus de l'image du runner.
  - name: Resolve NDK and glslc
    id: toolchain
    shell: bash
    run: |
      set -euo pipefail
      ndk=$(sed -n 's/^ *ndkVersion *= *"\(.*\)"/\1/p' \
        third_party/llama.kt/llama-kt/build.gradle.kts)
      [ -n "$ndk" ] || { echo "ndkVersion introuvable"; exit 1; }
      echo "NDK $ndk"

      if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
        echo "absent de l'image, installation"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
      fi

      glslc="$ANDROID_HOME/ndk/$ndk/shader-tools/linux-x86_64/glslc"
      [ -x "$glslc" ] || { echo "glslc absent du NDK: $glslc"; exit 1; }
      "$glslc" --version

      echo "glslc=$glslc" >> "$GITHUB_OUTPUT"
      # Nomme la version de glslc dans la clé de cache : le NDK 27 embarque
      # shaderc v2022.3, les paquets système v2026.2, et 131 des 136 fichiers
      # diffèrent entre les deux. Du SPIR-V valide dans les deux cas, mais
      # mélanger les deux toolchains dans un même build serait indébogable.
      echo "glslc_id=$("$glslc" --version | head -1 | tr -c '[:alnum:].' '-')" \
        >> "$GITHUB_OUTPUT"

  # Le SHA épinglé se lit dans l'index de llama.kt, sans checkouter les
  # 155 Mo : c'est ce qui permet de décider du cache avant de payer.
  - name: Resolve pinned llama.cpp revision
    id: llamacpp
    working-directory: third_party/llama.kt
    shell: bash
    run: |
      set -euo pipefail
      sha=$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')
      [ -n "$sha" ] || { echo "gitlink llama.cpp introuvable"; exit 1; }
      echo "llama.cpp $sha"
      echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # 202 Mo sur disque, ~21 Mo une fois compressés par le cache.
  # Restore/save séparés : on n'enregistre qu'après avoir vérifié que la
  # génération est complète, pour ne jamais figer un jeu partiel.
  - name: Restore generated Vulkan shaders
    id: shader-cache
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: |
        third_party/llama.kt/llama-kt/src/main/cpp/ggml-vulkan/shaders
        third_party/llama.kt/llama-kt/src/main/cpp/ggml-vulkan/ggml-vulkan-shaders.hpp
      key: vk-shaders-${{ steps.llamacpp.outputs.sha }}-${{ steps.toolchain.outputs.glslc_id }}

  - name: Init llama.cpp submodule
    if: steps.shader-cache.outputs.cache-hit != 'true'
    working-directory: third_party/llama.kt
    shell: bash
    run: git submodule update --init --depth 1 third_party/llama.cpp

  # Une seule copie de la procédure : scripts/gen-vulkan-shaders.sh dans
  # llama.kt, aussi appelé par bootstrap.sh et le README. Le script écrit
  # exactement les chemins mis en cache ci-dessus.
  - name: Generate Vulkan shaders
    if: steps.shader-cache.outputs.cache-hit != 'true'
    shell: bash
    run: third_party/llama.kt/scripts/gen-vulkan-shaders.sh "${{ steps.toolchain.outputs.glslc }}"

  # Vaut pour le hit comme pour le miss : un cache tronqué se verrait ici,
  # pas trois minutes plus tard dans une erreur de link illisible.
  - name: Check shader set is complete
    shell: bash
    run: |
      set -euo pipefail
      OUT=third_party/llama.kt/llama-kt/src/main/cpp/ggml-vulkan
      test -s "$OUT/ggml-vulkan-shaders.hpp"
      n=$(find "$OUT/shaders" -name '*.comp.cpp' | wc -l)
      echo "$n fichiers .comp.cpp"
      [ "$n" -eq 155 ] || { echo "attendu 155"; exit 1; }

  - name: Save generated Vulkan shaders
    if: steps.shader-cache.outputs.cache-hit != 'true'
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: |
        third_party/llama.kt/llama-kt/src/main/cpp/ggml-vulkan/shaders
        third_party/llama.kt/llama-kt/src/main/cpp/ggml-vulkan/ggml-vulkan-shaders.hpp
      key: ${{ steps.shader-cache.outputs.cache-primary-key }}

  # Quelques secondes, sans dépendance à mettre en cache.
  - name: Build libOpenCL.so
    shell: bash
    run: ./third_party/llama.kt/scripts/build-opencl.sh

  - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
    with:
      distribution: temurin
      java-version: '21'

  - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    with:
      cache-disabled: ${{ inputs.gradle-cache != 'true' }}
