name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (runner-images#14748).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only llama.kt, shallow: its own submodules are not needed for JVM tests.
      - name: Fetch llama.kt submodule
        run: git submodule update --init --depth 1 third_party/llama.kt

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle (dependencies) and the build cache across runs.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # :app:testDebugUnitTest does not run the tests of the modules app depends on.
      - name: Unit tests
        run: ./gradlew --no-daemon :websearch:test :app:testDebugUnitTest

      # The instrumented suite can never run here (no ARM runner, and
      # connectedCheck wipes the models off the device — see docs/ci.md).
      # Compiling it at least keeps those sources from rotting unnoticed.
      - name: Compile instrumented test sources
        run: ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            websearch/build/reports/tests/test/
          retention-days: 14
