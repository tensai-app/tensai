[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
# 2026.05.01: smallest BOM aligning every Compose artifact on 1.11; 1.11.2, the floor navigationevent-compose 1.1.2 sets through activity-compose 1.13 (TEN-209)
composeBom = "2026.05.01"
lifecycle = "2.11.0"
datastorePreferences = "1.3.0"
coreSplashscreen = "1.2.0"
navigationCompose = "2.10.2"
room = "2.8.5"
kotlinxCoroutines = "1.11.0"
commonmark = "0.32.0"
junit = "4.13.2"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
orgJson = "20240303"
aboutLibraries = "15.3.0"
okhttp = "5.5.1"
kotlinxSerialization = "1.12.0"
work = "2.12.0"
jsoup = "1.23.2"
jspecify = "1.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
